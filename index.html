<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png">
<title>ShopPro DZ — إدارة المحل</title>
<style>
:root{--c:#2563eb;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#e5e7eb;--danger:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}
.side{width:250px;background:#111827;color:#fff;padding:18px;position:fixed;right:0;top:0;bottom:0;overflow:auto;z-index:20}.brand{font-size:21px;font-weight:800;padding:10px 8px 20px}.brand small{display:block;color:#9ca3af;font-size:11px;margin-top:5px}
.nav button{width:100%;text-align:right;background:transparent;color:#d1d5db;padding:12px;border-radius:10px;margin:3px 0}.nav button:hover,.nav button.active{background:var(--c);color:#fff}
.main{margin-right:250px;width:calc(100% - 250px);padding:20px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}.mobile{display:none}.title{font-size:24px;font-weight:800}.sub{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:17px;box-shadow:0 2px 10px #00000008}.metric{font-size:25px;font-weight:800;margin-top:8px}.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.panel{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:17px;margin-top:15px}.panel h3{margin:0 0 14px}
.btn{background:var(--c);color:#fff;padding:10px 14px;border-radius:9px}.btn.secondary{background:#eef2ff;color:#1e40af}.btn.danger{background:#fee2e2;color:#b91c1c}.btn.ok{background:#dcfce7;color:#166534}.btn.gray{background:#eef0f3;color:#374151}
.actions{display:flex;gap:8px;flex-wrap:wrap}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:12px;margin-bottom:5px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;background:#fff}.field textarea{min-height:80px}.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:right;font-size:13px}th{background:#f8fafc}.scroll{overflow:auto}
.badge{padding:4px 8px;border-radius:20px;font-size:11px;background:#eef2ff}.low{color:#b45309;background:#fef3c7}.out{color:#b91c1c;background:#fee2e2}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:15px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;width:min(900px,100%);max-height:92vh;overflow:auto;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.x{background:#f3f4f6;border-radius:8px;padding:7px}
.sale{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.cartrow{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding:10px 0}.searchbar{display:flex;gap:8px}.searchbar input{flex:1}.big{font-size:22px}.totalbox{font-size:18px;line-height:2}.empty{text-align:center;color:var(--muted);padding:25px}
.camera video{width:100%;max-height:55vh;background:#111;border-radius:12px}.scanframe{position:absolute;left:15%;right:15%;top:38%;height:24%;border:3px solid #fff;border-radius:10px;pointer-events:none}.videoWrap{position:relative}
.toast{position:fixed;bottom:18px;left:18px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:100}.toast.show{display:block}

/* ===== بيع سريع — تصميم الماسح (كاميرا + قائمة الأغراض) ===== */
.pos{display:grid;grid-template-columns:1fr;gap:0;max-width:1100px;margin:0 auto}
.pos-hero{position:relative;background:#1e293b;color:#fff;border-radius:24px 24px 0 0;min-height:340px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 22px 56px;overflow:hidden;transition:box-shadow .2s}
.pos-hero.flash{box-shadow:inset 0 0 0 5px #22c55e}
.pos-hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#0f172a}
.pos-hero.on video{display:block}
.pos-frame{display:none;position:absolute;left:12%;right:12%;top:24%;height:38%;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 999px rgba(15,23,42,.38);pointer-events:none}
.pos-hero.on .pos-frame{display:block}
.pos-live{display:none;position:absolute;bottom:44px;left:0;right:0;font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 6px #000a}
.pos-hero.on .pos-live{display:block}
.pos-off{position:relative;z-index:1;max-width:460px}
.pos-hero.on .pos-off{display:none}
.pos-ico{width:92px;height:92px;border-radius:50%;background:#334155;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:#fff}
.pos-off h2{margin:0 0 10px;font-size:26px;font-weight:600}
.pos-off p{margin:0 0 26px;color:#cbd5e1;font-size:16px;line-height:1.8}
.pos-main-btn{background:var(--c);color:#fff;border-radius:99px;padding:15px 34px;font-size:17px;font-weight:700;display:inline-flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.pos-round{position:absolute;left:16px;width:52px;height:52px;border-radius:50%;background:#0f172a;border:2px solid #334155;color:#fff;display:flex;align-items:center;justify-content:center;z-index:3}
#posBtnSet{top:16px}#posBtnCam{top:78px}
.pos-hero .ic-on{display:none}.pos-hero.on .ic-on{display:inline-flex}.pos-hero.on .ic-off{display:none}
.pos-sheet{background:var(--bg);color:var(--text);border-radius:28px 28px 0 0;margin-top:-28px;position:relative;z-index:2;padding:12px 20px 20px;min-height:380px;display:flex;flex-direction:column;box-shadow:0 -6px 20px #0002}
.pos-handle{width:58px;height:5px;border-radius:9px;background:#cbd5e1;margin:0 auto 14px}
.pos-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:4px 4px 14px;border-bottom:1px solid var(--border)}
.pos-h1{font-size:24px;font-weight:700}
.pos-tot{text-align:left}.pos-tot small{display:block;color:var(--muted);font-size:12px;letter-spacing:.5px;font-weight:700}.pos-tot b{font-size:30px;color:var(--c);line-height:1.2}
.pos-items{flex:1;overflow:auto;min-height:170px;padding:6px 2px}
.pos-empty{text-align:center;padding:30px 10px;color:var(--muted)}
.pos-empty .pos-bask{width:110px;height:110px;border-radius:50%;background:rgba(148,163,184,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:#cbd5e1}
.pos-empty h3{margin:0 0 8px;color:var(--text);font-size:22px}
.pos-empty p{margin:0;line-height:1.8}
.pos-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin:8px 0}
.pos-item-end{text-align:left;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pos-qty{display:flex;align-items:center;gap:6px}
.pos-qty button{width:32px;height:32px;border-radius:9px;background:#eef0f3;color:#374151;font-size:16px}
.pos-qty button.rm{background:#fee2e2;color:#b91c1c}
.pos-qty span{min-width:22px;text-align:center;font-weight:700}
.pos-foot{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.pos-foot .row{display:flex;gap:8px}.pos-foot .row .btn{flex:1}
.pos-review-btn{width:100%;padding:17px;border-radius:18px;background:var(--c);color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px}
.pos-review-btn:disabled{background:#d1d5db;color:#6b7280;cursor:not-allowed}
@media(min-width:1000px){
 .pos{grid-template-columns:1.1fr 1fr;gap:18px}
 .pos-hero{border-radius:24px;min-height:520px}
 .pos-sheet{margin-top:0;border-radius:24px;border:1px solid var(--border);max-height:calc(100vh - 130px);position:sticky;top:15px}
}
@media(max-width:650px){.pos-hero{min-height:300px;border-radius:20px 20px 0 0}.pos-h1{font-size:21px}.pos-tot b{font-size:26px}}

.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-top:12px}.product-tile{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--card);text-align:right;display:flex;flex-direction:column;gap:7px;min-height:130px}.product-tile img{width:100%;height:90px;object-fit:contain;border-radius:8px}.product-tile .tile-name{font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;color:#1e40af;font-size:12px}.inline-filters{display:flex;gap:8px;flex-wrap:wrap}.inline-filters>*{flex:1;min-width:140px}.danger-text{color:#b91c1c}.ok-text{color:#166534}.small-btn{padding:6px 9px;font-size:12px}.product-photo{max-width:55px;max-height:55px;object-fit:contain}.notice{padding:12px;border-radius:10px;background:#fffbeb;border:1px solid #fde68a;margin:10px 0;color:#92400e}

@media(max-width:900px){.side{width:220px}.main{margin-right:220px;width:calc(100% - 220px)}.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(2,1fr)}.sale{grid-template-columns:1fr}}
@media(max-width:650px){.side{transform:translateX(100%);transition:.2s;width:270px}.side.open{transform:translateX(0)}.main{margin:0;width:100%;padding:12px}.mobile{display:block}.cards{grid-template-columns:1fr 1fr;gap:8px}.card{padding:12px}.metric{font-size:20px}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.title{font-size:20px}th,td{white-space:nowrap}}

/* Tijara/ShopPro polished blue-cyan theme and language layout */
:root{--c:#0878f9;--brand-blue:#0755d9;--brand-cyan:#08c8ed}
.btn{background:linear-gradient(135deg,#0878f9,#0755d9);box-shadow:0 4px 12px #0878f91c;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 18px #0878f92b}
.side{background:linear-gradient(165deg,#071b55 0%,#0b2f82 55%,#06204e 100%)}
.brand{color:#fff;letter-spacing:.2px}.brand small{color:#9edfff}
.nav button{border:1px solid transparent;transition:background .18s,border-color .18s}
.nav button:hover{background:linear-gradient(90deg,#0878f9,#05bfe9);border-color:#65ddff;color:#fff}
.nav button.active{background:linear-gradient(100deg,#0878f9,#05bfe9);box-shadow:0 5px 16px #02aeea33;color:#fff}
.card,.panel{box-shadow:0 5px 18px #073a8010}
.card{border-top:3px solid #0aaef0}
#languageSelect{max-width:145px}
body.ltr{direction:ltr}
body.ltr .side{left:0;right:auto}
body.ltr .main{margin-right:0;margin-left:250px}
body.ltr .nav button{text-align:left}
body.ltr th,body.ltr td{text-align:left}
body.ltr .pos-tot{text-align:right}
body.ltr .cartrow{direction:ltr}
body.ltr .top{direction:ltr}
@media(max-width:900px){body.ltr .main{margin-left:220px;margin-right:0}}
@media(max-width:650px){body.ltr .side{transform:translateX(-100%);left:0;right:auto}body.ltr .side.open{transform:translateX(0)}body.ltr .main{margin:0;width:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"><div class="brand">🏪 ShopPro DZ<small>نظام إدارة المحلات</small></div><div class="nav" id="nav"></div></aside>
<main class="main">
<div class="top"><div><button class="btn mobile" onclick="toggleSide()">☰</button> <span class="title" id="pageTitle">الرئيسية</span><div class="sub" id="shopSub"></div></div><div class="actions"><select id="languageSelect" aria-label="Language" onchange="setLanguage(this.value)" style="padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-weight:700"><option value="ar">🇩🇿 العربية</option><option value="en">🇬🇧 English</option><option value="fr">🇫🇷 Français</option></select><button class="btn secondary" onclick="openSale()">🛒 بيع سريع</button><button class="btn" onclick="openScanner()">▣ مسح باركود</button></div></div>
<section id="view"></section>
</main></div>

<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle"></h3><button class="x" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<div class="modal" id="camModal"><div class="modalbox camera">
<div class="modalhead"><h3>📷 مسح الباركود</h3><button class="x" onclick="closeScanner()">✕</button></div>

<div id="scanChooser">
<p><b>اختر طريقة قراءة الباركود:</b></p>
<div class="grid" style="margin-top:10px">
<button class="card" onclick="chooseCamera('phone')" style="cursor:pointer;text-align:center">📱<br><b>كاميرا الهاتف</b><br><span class="muted">الكاميرا الخلفية</span></button>
<button class="card" onclick="chooseCamera('computer')" style="cursor:pointer;text-align:center">💻<br><b>كاميرا الحاسوب</b><br><span class="muted">Webcam</span></button>
<button class="card" onclick="chooseUSB()" style="cursor:pointer;text-align:center">🔌<br><b>جهاز USB</b><br><span class="muted">قارئ باركود</span></button>
<button class="card" onclick="chooseManual()" style="cursor:pointer;text-align:center">✍️<br><b>إدخال يدوي</b><br><span class="muted">كتابة الرقم</span></button>
</div>
</div>

<div id="scanPanel" style="display:none">
<button class="btn gray" onclick="showScanChooser()">← طرق المسح</button>
<div id="cameraPanel" style="display:none;margin-top:12px">
<div class="videoWrap"><video id="video" autoplay muted playsinline></video><div class="scanframe"></div></div>
<p id="cameraStatus" class="muted">وجّه الباركود داخل الإطار.</p>
<div class="actions"><button class="btn" onclick="startSelectedCamera()">▶ تشغيل الكاميرا</button><button class="btn gray" onclick="stopCameraOnly()">■ إيقاف</button></div>
</div>

<div id="usbPanel" style="display:none;margin-top:12px">
<p>وصّل جهاز قارئ الباركود USB، ثم اضغط داخل الحقل وامسح المنتج.</p>
<div class="field"><label>قارئ USB</label><input id="scannerInput" autocomplete="off" inputmode="numeric" placeholder="اضغط هنا ثم امسح الباركود" onkeydown="usbScanKey(event)"></div>
<button class="btn secondary" onclick="focusScanner()">⌨️ التركيز على القارئ</button>
</div>

<div id="manualPanel" style="display:none;margin-top:12px">
<div class="field"><label>رقم الباركود</label><input id="manualInput" inputmode="numeric" placeholder="اكتب رقم الباركود"></div>
<button class="btn" onclick="submitManual()">✅ استخدام الباركود</button>
</div>
</div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='shoppro_dz_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{settings:{shop:'محلي',type:'عطور',currency:'DA',color:'#2563eb',theme:'light'},products:[],customers:[],suppliers:[],expenses:[],sales:[]};
// Additive migration: existing records and settings are preserved.
db.settings=db.settings||{shop:'محلي',type:'عام',currency:'DA',color:'#2563eb',theme:'light'};
db.products=db.products||[];db.customers=db.customers||[];db.suppliers=db.suppliers||[];db.expenses=db.expenses||[];db.sales=db.sales||[];
db.cashTransactions=Array.isArray(db.cashTransactions)?db.cashTransactions:[];
db.cashOpening=Number(db.cashOpening||0);
['purchases','returns','stockMoves','payments','cashCounts','auditLogs','users'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});
db.settings=db.settings||{shop:'محلي',type:'عام',currency:'DA',color:'#2563eb',theme:'light'};
let current='home', cart=[], stream=null, detector=null, scanTimer=null;
const navItems=[['home','🏠 الرئيسية'],['sale','🛒 بيع سريع'],['products','📦 بضاعتي'],['customers','👥 الزبائن'],['suppliers','🚚 الموردين'],['expenses','💸 المصاريف'],['cashbox','🏦 الصندوق'],['purchases','🛒 فواتير الشراء'],['returns','↩️ المرتجعات'],['inventory','📦 الجرد والمخزون'],['users','👤 المستخدمون والصلاحيات'],['reports','📊 التقارير'],['sales','🧾 المبيعات والفواتير'],['settings','⚙️ الإعدادات']];
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function money(n){return Number(n||0).toLocaleString('ar-DZ')+' '+db.settings.currency}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(x=>`<button class="${current==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function home(){let today=new Date().toDateString(), sales=db.sales.filter(s=>new Date(s.date).toDateString()===today), ds=sales.reduce((a,s)=>a+s.total,0), dp=sales.reduce((a,s)=>a+s.profit,0), ex=db.expenses.filter(e=>new Date(e.date).toDateString()===today).reduce((a,e)=>a+e.amount,0), low=db.products.filter(p=>p.qty<=p.min).length, debts=db.customers.reduce((a,c)=>a+Number(c.balance||0),0);return `<div class="cards"><div class="card">💵 مبيعات اليوم<div class="metric">${money(ds)}</div></div><div class="card">📈 ربح اليوم<div class="metric">${money(dp)}</div></div><div class="card">💸 مصاريف اليوم<div class="metric">${money(ex)}</div></div><div class="card">📦 المنتجات<div class="metric">${db.products.length}</div></div><div class="card">⚠️ مخزون منخفض<div class="metric">${low}</div></div><div class="card">👥 الزبائن<div class="metric">${db.customers.length}</div></div><div class="card">📒 ديون الزبائن<div class="metric">${money(debts)}</div></div><div class="card">🚚 الموردون<div class="metric">${db.suppliers.length}</div></div><div class="card">🌸 منتجات العطور<div class="metric">${db.products.filter(p=>p.category&&/عطر|عطور|بخور|زيت/i.test(p.category)).length}</div></div></div><div class="grid"><div class="panel"><h3>إجراءات سريعة</h3><div class="actions"><button class="btn" onclick="openSale()">🛒 بيع سريع</button><button class="btn secondary" onclick="openProduct()">➕ إضافة منتج</button><button class="btn secondary" onclick="openScanner()">📷 باركود</button><button class="btn secondary" onclick="go('expenses')">💰 مصروف</button></div></div><div class="panel"><h3>تنبيهات المخزون</h3>${db.products.filter(p=>p.qty<=p.min).slice(0,8).map(p=>`<div class="cartrow"><span>${p.name}</span><b class="${p.qty===0?'out':'low'}">${p.qty===0?'نفد':'متبقي '+p.qty}</b></div>`).join('')||'<div class="empty">لا توجد تنبيهات 🎉</div>'}</div></div>`}
function scanIntoProduct(){
  const oldHandler=handleBarcode;
  // Open the same scanner UI, but put a successful code directly into the product form.
  document.getElementById('camModal').classList.add('show');
  focusScanner();
  const status=document.getElementById('cameraStatus');
  status.textContent='📦 سيتم وضع الباركود في خانة المنتج بعد المسح';
  if(!navigator.mediaDevices?.getUserMedia){manualProductBarcode();return;}
  startProductCamera();
}
function manualProductBarcode(){
  const x=prompt('أدخل الباركود للمنتج:');
  if(x){const b=document.getElementById('pb');if(b)b.value=x.trim();stopCamera();}
}
async function startProductCamera(){
  try{
    if(stream) stopCamera();
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const v=document.getElementById('video');v.srcObject=stream;await v.play().catch(()=>{});
    if('BarcodeDetector' in window){
      try{detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','codabar','itf','qr_code','data_matrix']});}catch{detector=new BarcodeDetector();}
      scanTimer=setInterval(async()=>{
        try{
          const codes=await detector.detect(v);
          if(codes?.[0]?.rawValue){
            const b=document.getElementById('pb');if(b)b.value=codes[0].rawValue;
            toast('✅ تم إدخال الباركود');
            stopCamera();
          }
        }catch{}
      },250);
    }else zxingFallback(v,{set textContent(x){toast(x)}},c=>{const b=document.getElementById('pb');if(b)b.value=c;toast('✅ تم إدخال الباركود')});
  }catch{manualProductBarcode();}
}
function filterPeople(el,type){let arr=(type==='customer'?db.customers:db.suppliers).filter(x=>(x.name+' '+x.phone+' '+x.address).toLowerCase().includes(el.value.toLowerCase()));document.querySelector('#'+type+'Table tbody').innerHTML=arr.map(x=>personRow(x,type)).join('')}

function submitManual(){
  const x=document.getElementById('manualInput').value.trim();
  if(!x)return toast('اكتب رقم الباركود');
  handleBarcode(x);
  document.getElementById('manualInput').value='';
}
async function startSelectedCamera(){
  const status=document.getElementById('cameraStatus');
  try{
    stopCameraOnly();
    if(!navigator.mediaDevices?.getUserMedia) throw Error('no camera');
    const constraints=selectedCamera==='phone'
      ? {video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}
      : {video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false};
    stream=await navigator.mediaDevices.getUserMedia(constraints);
    const video=document.getElementById('video');
    video.srcObject=stream;
    await video.play().catch(()=>{});
    status.textContent='✅ الكاميرا تعمل — ضع الباركود داخل الإطار.';
    if('BarcodeDetector' in window){
      try{
        detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','codabar','itf','qr_code','data_matrix']});
      }catch{detector=new BarcodeDetector();}
      scanTimer=setInterval(async()=>{
        if(!detector || video.readyState<2)return;
        try{
          const codes=await detector.detect(video);
          if(codes?.length && codes[0].rawValue){
            handleBarcode(codes[0].rawValue);
            stopCameraOnly();
          }
        }catch{}
      },250);
    }else{
      zxingFallback(video,status);
    }
  }catch(e){
    status.textContent='❌ لم يتم تشغيل الكاميرا. تأكد من إعطاء المتصفح إذن الكاميرا.';
    toast('تعذر تشغيل الكاميرا');
  }
}
function stopCameraOnly(){
  if(scanTimer)clearInterval(scanTimer);
  scanTimer=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  const v=document.getElementById('video');
  if(v)v.srcObject=null;
}
function stopCamera(){closeScanner();}
function manualScan(){chooseManual();}
function usbScanKey(e){
  if(e.key==='Enter'){
    e.preventDefault();
    const x=document.getElementById('scannerInput').value.trim();
    if(x){handleBarcode(x);document.getElementById('scannerInput').value='';}
  }
}
function handleBarcode(code){
  code=String(code||'').trim();
  if(!code)return;
  const p=db.products.find(p=>String(p.barcode||'').trim()===code||String(p.code||'').trim()===code);
  if(p){
    closeScanner();
    if(current!=='sale')go('sale');
    addCart(p.id);
    toast('✅ تم العثور على: '+p.name);
  }else{
    toast('الباركود غير موجود: '+code);
    if(confirm('الباركود غير موجود. هل تريد إنشاء منتج جديد بهذا الباركود؟')){
      closeScanner();openProduct();
      setTimeout(()=>{const b=document.getElementById('pb');if(b){b.value=code;b.focus()}},100);
    }
  }
}

let keybuf='',keytime=0;
document.addEventListener('keypress',e=>{
  const target=e.target;
  if(target && (target.tagName==='INPUT'||target.tagName==='TEXTAREA'||target.tagName==='SELECT')){
    if(target.id==='scannerInput') return;
    return;
  }
  const now=Date.now();
  if(now-keytime>80) keybuf='';
  keytime=now;
  if(e.key==='Enter'){
    if(keybuf.length>=4){handleBarcode(keybuf);keybuf='';}
  }else if(e.key.length===1){
    keybuf+=e.key;
    if(keybuf.length>80) keybuf=keybuf.slice(-80);
  }
});

function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.products)||!Array.isArray(x.sales))throw 0;let mode=prompt('اكتب 1 لاستبدال البيانات الحالية، أو 2 لدمج النسخة مع البيانات الحالية. ننصح بعمل نسخة احتياطية أولًا.','2');if(mode==='1'){if(!confirm('سيتم استبدال البيانات الحالية. هل صدّرت نسخة احتياطية؟'))return;db=x}else if(mode==='2'){let merged={...db,...x,settings:(db.products.length||db.sales.length)?{...x.settings,...db.settings}:{...db.settings,...x.settings}};['products','customers','suppliers','expenses','sales','cashTransactions','purchases','returns','stockMoves','payments','cashCounts','auditLogs','users'].forEach(k=>{let cur=Array.isArray(db[k])?db[k]:[],inc=Array.isArray(x[k])?x[k]:[],map=new Map(inc.map(v=>[String(v.id),v]));cur.forEach(v=>map.set(String(v.id),v));merged[k]=[...map.values()]});db=merged}else return;ensureArrays();save();apply();renderNav();render();toast('تم استيراد البيانات')}catch(err){alert('ملف غير صالح أو تعذر قراءته')}};r.readAsText(f);e.target.value=''}

/* ===================== v3 UPGRADES ===================== */
// 1) معرّفات فريدة وأرقام فواتير متسلسلة
function uid(){uid.n=(uid.n||0)+1;return Date.now().toString(36)+uid.n.toString(36)+Math.random().toString(36).slice(2,6)}
function nextNo(p){db.settings.seq=db.settings.seq||{};let n=(db.settings.seq[p]||0)+1;db.settings.seq[p]=n;return p+String(n).padStart(6,'0')}
// 2) تشفير رموز الدخول (SHA-256 + salt + تكرار)
function sha256(ascii){function rr(v,a){return(v>>>a)|(v<<(32-a))}var mp=Math.pow,mw=mp(2,32),i,j,r='',words=[],bl=ascii.length*8,hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,ic={};for(var c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8}words[words.length]=((bl/mw)|0);words[words.length]=bl;for(j=0;j<words.length;){var w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;r+=((b<16)?0:'')+b.toString(16)}return r}
function hashPin(pin,salt){let h=salt+':'+pin;for(let i=0;i<1000;i++)h=sha256(h+salt);return h}
function verifyPin(u,pin){if(u.pinHash)return hashPin(pin,u.salt)===u.pinHash;if(u.pin!==undefined&&u.pin===pin){u.salt=uid();u.pinHash=hashPin(pin,u.salt);delete u.pin;save();return true}return false}
function migratePins(){let ch=false;db.users.forEach(u=>{if(u.pin!==undefined&&!u.pinHash){u.salt=uid();u.pinHash=hashPin(String(u.pin),u.salt);delete u.pin;ch=true}});if(ch)save()}
// 3) صلاحيات فعلية
const EMP_PAGES=['home','sale','products','customers','inventory','sales','returns'];
function curUser(){return db.users.find(x=>String(x.id)===String(sessionStorage.getItem('shoppro_auth')))}
function canAdmin(){let u=curUser();return !db.users.length||!!u&&u.role==='admin'}
function canPage(p){return canAdmin()||EMP_PAGES.includes(p)}
renderNav=function(){document.getElementById('nav').innerHTML=navItems.filter(x=>canPage(x[0])).map(x=>`<button class="${current==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')};
{const _go=go;go=function(p){if(!canPage(p))return toast('ليس لديك صلاحية لفتح هذا القسم');return _go(p)}}
addUser=function(){let name=document.getElementById('newUserName').value.trim(),pin=document.getElementById('newUserPin').value.trim(),role=document.getElementById('newUserRole').value;if(!name||!/^\d{4,}$/.test(pin))return toast('أدخل اسمًا ورمز دخول من 4 أرقام فأكثر');if(db.users.some(u=>u.name.toLowerCase()===name.toLowerCase()))return toast('اسم المستخدم موجود مسبقًا');let first=!db.users.length;if(first)role='admin';let salt=uid(),id=uid();db.users.push({id,name,salt,pinHash:hashPin(pin,salt),role,createdAt:new Date().toISOString()});if(first){sessionStorage.setItem('shoppro_auth',id);db.settings.activeUser=name}logAction('مستخدمون','إضافة مستخدم '+name);save();renderNav();render();toast('تمت إضافة المستخدم'+(first?' (مدير)':''))};
{const _du=deleteUser;deleteUser=function(id){let u=db.users.find(x=>String(x.id)===String(id));if(u&&u.role==='admin'&&db.users.filter(x=>x.role==='admin').length<2)return toast('لا يمكن حذف آخر مدير');return _du(id)}}
loginUser=function(){let id=document.getElementById('authUser').value,pin=document.getElementById('authPin').value,u=db.users.find(x=>String(x.id)===String(id)),err=document.getElementById('authError'),lk={};try{lk=JSON.parse(localStorage.getItem('shoppro_lock')||'{}')}catch{}if(lk.until>Date.now()){err.textContent='محاولات كثيرة خاطئة — انتظر '+Math.ceil((lk.until-Date.now())/1000)+' ثانية';return}if(!u||!verifyPin(u,pin)){lk.n=(lk.n||0)+1;if(lk.n>=5){lk.until=Date.now()+30000*Math.min(10,Math.floor(lk.n/5));}localStorage.setItem('shoppro_lock',JSON.stringify(lk));err.textContent='رمز الدخول غير صحيح';return}localStorage.removeItem('shoppro_lock');sessionStorage.setItem('shoppro_auth',u.id);db.settings.activeUser=u.name;document.getElementById('authOverlay')?.remove();renderNav();render();toast('مرحبًا '+u.name)};
['del','wipe','clearSection','restore','backup','deleteUser','addUser','saveSettings','deleteCashMovement'].forEach(n=>{const f=window[n];if(typeof f!=='function')return;window[n]=function(...a){if(!canAdmin())return toast('هذه العملية للمدير فقط');return f.apply(this,a)}});
// 4) حفظ أكثر أمانًا: نسخة IndexedDB تلقائية + استرجاع + تنبيه نسخ احتياطي يومي
function idbOpen(){return new Promise((res,rej)=>{let r=indexedDB.open('shoppro_idb',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(v){try{let d=await idbOpen();d.transaction('kv','readwrite').objectStore('kv').put(v,'db')}catch{}}
async function idbGet(){try{let d=await idbOpen();return await new Promise(r=>{let q=d.transaction('kv').objectStore('kv').get('db');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch{return null}}

function posPrefs(){let d={cam:'environment',sound:true,auto:false};try{return Object.assign(d,JSON.parse(localStorage.getItem('shoppro_pos')||'{}'))}catch{return d}}

function posBeep(ok){let p=posPrefs();if(p.sound){try{posAC=posAC||new(window.AudioContext||window.webkitAudioContext)();let o=posAC.createOscillator(),g=posAC.createGain();o.type='sine';o.frequency.value=ok?1000:300;g.gain.value=.08;o.connect(g);g.connect(posAC.destination);o.start();o.stop(posAC.currentTime+(ok?.12:.25))}catch{}}try{navigator.vibrate&&navigator.vibrate(ok?40:[60,40,60])}catch{}}

addCart=function(id){let p=db.products.find(x=>String(x.id)===String(id));if(!p){toast('المنتج غير موجود');return false}let x=cart.find(x=>String(x.id)===String(id));if(x){if(x.qty<Number(p.qty))x.qty++;else{toast('الكمية غير متوفرة');return false}}else{if(Number(p.qty)<=0){toast('المنتج نافد');return false}cart.push({id:p.id,name:p.name,price:Number(p.sale)||0,cost:Number(p.buy)||0,qty:1})}toast('✅ '+p.name);posUpdate();return true};
cartQty=function(i,d){let x=cart[i];if(!x)return;let p=db.products.find(p=>String(p.id)===String(x.id));x.qty+=d;if(x.qty<=0)cart.splice(i,1);else if(p&&x.qty>Number(p.qty)){x.qty=Number(p.qty);toast('الكمية غير متوفرة')}posUpdate()};

async function posStartCam(){
 let v=document.getElementById('posVideo');if(!v||posStarting)return;
 posStarting=true;posStopCam();
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw 0;
  let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:posPrefs().cam},width:{ideal:1280},height:{ideal:720}},audio:false});
  if(document.getElementById('posVideo')!==v){s.getTracks().forEach(t=>t.stop());posStarting=false;return}
  posStream=s;v.srcObject=s;await v.play().catch(()=>{});
  posCamOn=true;posHeroState();
  if('BarcodeDetector' in window){
   let det;try{det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','codabar','itf','qr_code','data_matrix']})}catch{det=new BarcodeDetector()}
   posTimer=setInterval(async()=>{if(v.readyState<2)return;try{let c=await det.detect(v);if(c&&c[0]&&c[0].rawValue)posOnCode(c[0].rawValue)}catch{}},250);
  }else posZxStart(v);
 }catch(e){posCamOn=false;posHeroState();toast('تعذر تشغيل الكاميرا — اسمح للمتصفح باستعمالها (يلزم رابط https)')}
 posStarting=false;
}
function posStopCam(){if(posTimer){clearInterval(posTimer);posTimer=null}try{posZx&&posZx.reset()}catch{}posZx=null;if(posStream){posStream.getTracks().forEach(t=>t.stop());posStream=null}let v=document.getElementById('posVideo');if(v)v.srcObject=null;posCamOn=false;posHeroState()}
function posZxStart(v){let run=()=>{try{posZx=new ZXing.BrowserMultiFormatReader();posZx.decodeFromVideoElement(v,r=>{if(r)posOnCode(r.getText())})}catch{toast('تعذر تشغيل القارئ البديل — استعمل USB أو الإدخال اليدوي')}};if(window.ZXing)return run();let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=run;s.onerror=()=>toast('يلزم إنترنت لتحميل القارئ البديل');document.head.appendChild(s)}
function posOnCode(code){
 code=String(code||'').trim();if(!code)return;
 let n=Date.now();if(code===posLast.c&&n-posLast.t<2000)return;if(n-posLast.t<700)return;posLast={c:code,t:n};
 let p=db.products.find(p=>String(p.barcode||'').trim()===code||String(p.code||'').trim()===code);
 if(!p){posBeep(false);toast('الباركود غير موجود: '+code);return}
 if(addCart(p.id)){posBeep(true);let h=document.getElementById('posHero');if(h){h.classList.add('flash');setTimeout(()=>h.classList.remove('flash'),250)}}else posBeep(false);
}

function setLanguage(lang){
  if(!['ar','en','fr'].includes(lang))lang='ar';
  db.settings.language=lang;save();closeModal();closeScanner();renderNav();render();
  if(lang==='ar'){const b=document.querySelector('.brand');if(b)b.innerHTML='🏪 ShopPro DZ<small>نظام إدارة المحلات</small>';const title=document.getElementById('pageTitle');if(title){const item=navItems.find(x=>x[0]===current);if(item)title.textContent=item[1].replace(/^\S+\s*/, '')}}
  applyLanguage(lang);
  const sel=document.getElementById('languageSelect');if(sel)sel.value=lang;
}
function applyLanguage(lang){
  lang=lang||db.settings.language||'ar';
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.body.classList.toggle('ltr',lang!=='ar');
  const sel=document.getElementById('languageSelect');if(sel)sel.value=lang;
  const dict=UI_TRANSLATIONS[lang]||{};
  if(lang==='ar')return;
  const walk=(root)=>{
    if(!root)return;
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    let n;
    while(n=walker.nextNode()){
      const raw=n.nodeValue, trimmed=raw.trim();
      if(!trimmed)continue;
      let translated=raw;
      Object.keys(dict).sort((a,b)=>b.length-a.length).forEach(key=>{translated=translated.split(key).join(dict[key])});
      if(translated!==raw)n.nodeValue=translated;
    }
    root.querySelectorAll('input[placeholder],textarea[placeholder],option,label,button,[title]').forEach(el=>{
      ['placeholder','title'].forEach(a=>{if(el.hasAttribute(a)&&dict[el.getAttribute(a)])el.setAttribute(a,dict[el.getAttribute(a)])});
    });
  };
  walk(document.getElementById('side'));walk(document.getElementById('view'));walk(document.getElementById('modal'));walk(document.getElementById('camModal'));
}
const langObserver=new MutationObserver(()=>{if((db.settings.language||'ar')!=='ar')applyLanguage(db.settings.language)});
langObserver.observe(document.body,{childList:true,subtree:true,characterData:true});
/* ================== End multilingual UI ================== */

ensureArrays();migratePins();
authGate();apply();renderNav();render();setTimeout(()=>{if(current==='products')renderProductTable()},0);
setTimeout(()=>applyLanguage(db.settings.language||'ar'),0);
